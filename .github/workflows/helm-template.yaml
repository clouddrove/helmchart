name: Helm CI
on:
  pull_request:
    paths:
      - 'charts/**'
jobs:
  helm-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@master
    - name: helm-check-helmchart
      uses: igabaydulin/helm-check-action@0.2.1
      env:
        CHART_LOCATION: ./charts/helmchart
        CHART_VALUES: ./tests/overrides-helmchart.yaml
    - name: helm-check-cronjob
      uses: igabaydulin/helm-check-action@0.2.1
      env:
        CHART_LOCATION: ./charts/cronjob
        CHART_VALUES: ./tests/overrides-cronjob.yaml

    - name: Run helm unittest
      run: |
        # Helm 4 refuses a plugin it cannot verify from a git source.
        helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.2.1 --verify=false
        # The suites live in charts/helmchart/tests (the default -f pattern).
        helm unittest ./charts/helmchart


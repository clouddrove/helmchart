{{- if and .Values.metrics.enabled .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudflared-tunnel.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudflared-tunnel.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    {{- include "cloudflared-tunnel.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ .Values.metrics.portName | default "metrics" }}
      port: {{ .Values.metrics.port | default 2000 }}
      targetPort: {{ .Values.metrics.portName | default "metrics" }}
      protocol: TCP
{{- end }}

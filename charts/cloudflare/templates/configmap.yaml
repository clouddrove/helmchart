{{- if .Values.configmap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudflared-tunnel.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudflared-tunnel.labels" . | nindent 4 }}
  {{- with .Values.configmap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- toYaml .Values.configmap.data | nindent 2 }}
{{- end }}


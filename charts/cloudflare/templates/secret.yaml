{{- if and .Values.secret.enabled (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudflared-tunnel.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudflared-tunnel.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  TUNNEL_TOKEN: {{ .Values.secret.token | default "" | quote }}
{{- end }}

suite: Test  deployment
values:
  - ../values.yaml
  - ../config/override-values.yaml 
templates:
  - deployment.yaml
  # deployment.yaml includes these for its checksum annotations.
  - configmap.yaml
  - secret.yaml
chart:
  version: 0.0.6
  appVersion: v2

tests:
  - it: should pass all kinds of assertion
    set:
      service.port: 80
      type: ClusterIP
    template: templates/deployment.yaml
    documentIndex: 0                  
    asserts:
      - isAPIVersion:
          of: apps/v1    
      - isKind:
          of: Deployment
      - hasDocuments:
          count: 1
      - isNotNull:
          path: spec.template.spec
      - isNotNull:
          path: spec.template.spec.containers                     
      - isNotNull:
          path: spec.template
      - isNotNull:
          path: spec.selector
                                                                                                     

  - it: renders no topologySpreadConstraints by default
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: fills in the release selector when a constraint has none
    release:
      name: printer-api
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: DoNotSchedule
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/instance"]
          value: printer-api

  - it: keeps an explicit labelSelector as given
    set:
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              team: print
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector
          value:
            matchLabels:
              team: print
